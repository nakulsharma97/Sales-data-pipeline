name: CI — Tests, dashboard smoke test & Docker build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest --maxfail=1 -q

      - name: Smoke test — dashboard must boot and answer
        run: |
          streamlit run app.py --server.port 8501 --server.headless true &
          sleep 8
          curl --fail --retry 5 --retry-delay 2 http://localhost:8501/_stcore/health

      - name: Build Docker image
        run: docker build -t retail-sales-analytics .
