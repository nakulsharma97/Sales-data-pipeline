# Streamlit theme and server defaults (used locally and in Docker)
[theme]
primaryColor = "#F55036"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FFF7F2"
textColor = "#1F2937"
font = "sans serif"

[server]
headless = true
# Must match upload_validation.MAX_FILE_MB — one consistent limit shown in the UI
maxUploadSize = 20
